; SenseCAP Indicator D1L with LoRa (SX1262 behind the TCA9535 IO expander).
; Display and touch config come from the upstream ESP-NOW variant.

[SenseCapIndicator_HomeMesh]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; two OTA app slots for Wi-Fi updates
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/sensecap_indicator_homemesh
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=40
  -D PIN_USER_BTN=38
  -D IO_EXPANDER=0x40
  -D IO_EXPANDER_IRQ=42
  ; ESP32Board needs direct GPIOs for these. DIO1 only reaches the ESP32 via
  ; the expander /INT line (42). NSS has no GPIO at all (41 = SPI clock stands
  ; in); IndicatorBoard overrides powerOff(), so the deep-sleep code that
  ; uses P_LORA_NSS never runs.
  -D P_LORA_DIO_1=42
  -D P_LORA_NSS=41
  -D HAS_TOUCH
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=HomeMeshSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D RADIOLIB_SPI_PARANOID=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/sensecap_indicator_homemesh/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
lib_deps = ${esp32_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
  densaugeo/base64 @ ~1.4.0

; Hardware bring-up: stock companion firmware with the upstream ui-new,
; scaled up for the 480x480 panel. Used to check radio, display and button
; before the HomeMesh interface exists.
[env:SenseCapIndicator_HomeMesh_bringup]
extends = SenseCapIndicator_HomeMesh
build_flags =
  ${SenseCapIndicator_HomeMesh.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=HomeMeshDisplay
  -D DISPLAY_LINES=21
  -D LINE_LENGTH=53
  -D UI_ZOOM=3.5
  -D UI_RECENT_LIST_SIZE=9
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${SenseCapIndicator_HomeMesh.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>

; HomeMesh: companion firmware with the HomeMesh touch interface (LVGL).
[env:SenseCapIndicator_HomeMesh]
extends = SenseCapIndicator_HomeMesh
build_flags =
  ${SenseCapIndicator_HomeMesh.build_flags}
  -I examples/companion_radio/ui-homemesh
  -I examples/companion_radio/ui-homemesh/device
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D DISPLAY_CLASS=HomeMeshDisplay
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  ; only switches on the Wi-Fi update code in ESP32Board.cpp
  -D ADMIN_PASSWORD
build_src_filter = ${SenseCapIndicator_HomeMesh.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-homemesh/UITask.cpp>
  +<../examples/companion_radio/ui-homemesh/HomeMeshUI.cpp>
  +<../examples/companion_radio/ui-homemesh/fonts/*.c>
lib_deps = ${SenseCapIndicator_HomeMesh.lib_deps}
  ${esp32_ota.lib_deps}
  lvgl/lvgl @ 9.4.0

; RP2040 co-processor of the Indicator: buzzer firmware for HomeMesh.
; Not MeshCore - a separate small program (examples/homemesh_rp2040).
[env:SenseCapIndicator_HomeMesh_rp2040]
platform = ${rp2040_base.platform}
board = rpipico
board_build.core = earlephilhower
framework = arduino
build_flags = -I examples/companion_radio/ui-homemesh
build_src_filter = -<*> +<../examples/homemesh_rp2040/>
